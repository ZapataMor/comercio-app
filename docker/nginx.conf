resolver 127.0.0.11 valid=10s ipv6=off;
# Solo se publica Caddy; el puerto de nginx queda dentro de la red Docker.
# Caddy reemplaza X-Forwarded-For y no confía en el encabezado del cliente.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=api_rafagas:10m rate=10r/s;
upstream php_backend {
    zone php_backend 64k;
    server app:9000 resolve;
}

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 16m;
    client_body_timeout 20s;
    client_header_timeout 10s;
    send_timeout 25s;
    add_header X-Content-Type-Options nosniff always;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        limit_req zone=api_rafagas burst=30 nodelay;
        limit_req_status 429;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass php_backend;
        fastcgi_connect_timeout 5s;
        fastcgi_read_timeout 30s;
        fastcgi_send_timeout 25s;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
